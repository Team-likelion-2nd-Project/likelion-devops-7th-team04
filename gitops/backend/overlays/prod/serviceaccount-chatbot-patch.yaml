# base/serviceaccount-chatbot.yaml의 role-arn은 dev IAM Role
# (team04-hotel-chatbot-service-role, project_name="team04-hotel")을 가리킨다.
# prod는 environments/prod/main.tf에서 iam 모듈 project_name을 "team04-hotel-prod"로
# 분리해뒀기 때문에 실제 Role 이름이 team04-hotel-prod-chatbot-service-role이다 —
# 이 값을 안 바꾸면 prod pod가 dev의 Role을 assume하려다 OIDC 신뢰 정책 불일치로
# AccessDenied가 난다(prod 클러스터의 OIDC provider는 dev Role의 신뢰 정책에 없음).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chatbot-service
  namespace: backend
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::834922934330:role/team04-hotel-prod-chatbot-service-role