# DEV-201: base가 액세스 로그 버킷을 dev 버킷(team04-dev-access-logs)으로 하드코딩하고
# 있다. prod 전용 버킷(team04-prod-access-logs, environments/prod/main.tf의
# module.logging)이 이미 있으므로 prod ALB 로그는 그쪽에 쌓이게 override한다 — 안 그러면
# dev/prod 액세스 로그가 같은 버킷에 섞인다. (버킷 정책 자체는 서비스 프린시펄
# logdelivery.elasticloadbalancing.amazonaws.com에 리소스 조건 없이 허용돼 있어 ALB 생성
# 자체를 막는 문제는 아니었지만, 로그 격리를 위해 분리한다.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: backend
  annotations:
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=team04-prod-access-logs,access_logs.s3.prefix=alb
