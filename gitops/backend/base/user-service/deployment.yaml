apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        # DEV-196: api-gateway를 aws_eks_node_group.api_cpu로 이전하며 backend Fargate
        # profile selector가 라벨 게이트로 바뀌어(infra/terraform/modules/eks/main.tf),
        # 지금 배치(Fargate)를 유지하려면 이 라벨이 필요합니다.
        compute: fargate
    spec:
      # graceful shutdown: auth-service/deployment.yaml과 동일한 이유.
      terminationGracePeriodSeconds: 30
      containers:
        - name: user-service
          image: 834922934330.dkr.ecr.us-east-1.amazonaws.com/team04-dev-user-service:dev
          ports:
            - containerPort: 3001
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_PORT
              value: "3306"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_HOST
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_PASSWORD
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_DATABASE
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
