apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: 834922934330.dkr.ecr.us-east-1.amazonaws.com/team04-dev-booking-service:dev
          ports:
            - containerPort: 3003
          env:
            - name: NODE_ENV
              value: "production"
            - name: HOTEL_SERVICE_HOST
              value: "hotel-service:3002"
            - name: DB_PORT
              value: "3306"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_HOST
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_PASSWORD
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_DATABASE
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
