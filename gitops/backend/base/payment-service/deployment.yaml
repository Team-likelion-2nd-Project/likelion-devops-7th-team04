apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        # DEV-196: api-gateway를 aws_eks_node_group.api_cpu로 이전하며 backend Fargate
        # profile selector가 라벨 게이트로 바뀌어(infra/terraform/modules/eks/main.tf),
        # 지금 배치(Fargate)를 유지하려면 이 라벨이 필요합니다.
        compute: fargate
    spec:
      containers:
        - name: payment-service
          image: 834922934330.dkr.ecr.us-east-1.amazonaws.com/team04-dev-payment-service:dev
          ports:
            - containerPort: 3004
          # payment-service가 TypeORM(MariaDB)과 booking-service gRPC 클라이언트를 쓰게 되어
          # hotel-service/booking-service와 동일한 패턴으로 DB 접속 정보(backend-secrets Secret)와
          # BOOKING_SERVICE_HOST를 추가했습니다. PG_MOCK_SERVICE_URL은 pg-mock-service의
          # k8s Service DNS를 가리킵니다(gitops/backend/base/pg-mock-service/service.yaml).
          env:
            - name: NODE_ENV
              value: "production"
            - name: BOOKING_SERVICE_HOST
              value: "booking-service:3003"
            - name: PG_MOCK_SERVICE_URL
              value: "http://pg-mock-service:3007"
            - name: DB_PORT
              value: "3306"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_HOST
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_PASSWORD
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_DATABASE
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
