# infra/terraform/modules/eks/main.tf의 aws_eks_pod_identity_association.chatbot이
# namespace = var.chatbot_namespace ("backend"), service_account = var.chatbot_service_account
# ("chatbot-service")를 참조합니다. EKS Pod Identity는 IRSA와 달리 ServiceAccount에
# eks.amazonaws.com/role-arn 어노테이션이 필요 없습니다 (이름만 일치하면 됨).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chatbot-service
  namespace: backend
