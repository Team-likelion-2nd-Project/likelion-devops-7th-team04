# DEV-184: chat-bot-service는 backend 네임스페이스 전체와 함께 Fargate에서 도는데,
# Fargate는 DaemonSet(eks-pod-identity-agent)을 못 띄워서 EKS Pod Identity로는
# 자격증명을 받을 수 없었다(DynamoDB 호출이 CredentialsProviderError로 매번 실패 →
# 챗봇 503, 실측 확인됨). alb_controller(DEV-170)와 동일하게 DaemonSet에 의존하지 않는
# IRSA(OIDC)로 전환 — infra/terraform/modules/iam/main.tf의 aws_iam_role.chatbot_service
# 신뢰 정책도 같이 IRSA로 바뀌었다. IRSA는 Pod Identity와 달리 아래 어노테이션이 있어야
# EKS가 pod에 AWS_ROLE_ARN/AWS_WEB_IDENTITY_TOKEN_FILE을 주입해준다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chatbot-service
  namespace: backend
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::834922934330:role/team04-hotel-chatbot-service-role
