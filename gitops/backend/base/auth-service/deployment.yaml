apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        # DEV-196: api-gateway를 aws_eks_node_group.api_cpu로 이전하며 backend Fargate
        # profile selector가 라벨 게이트로 바뀌어(infra/terraform/modules/eks/main.tf),
        # 지금 배치(Fargate)를 유지하려면 이 라벨이 필요합니다.
        compute: fargate
    spec:
      # graceful shutdown: api-gateway/deployment.yaml과 동일한 이유 — 이 서비스도
      # HPA(hpa.yaml)로 스케일다운되므로 SIGTERM 처리 없이는 그 순간 처리 중이던 gRPC
      # 요청이 끊긴다. 이 서비스는 HTTP가 아니라 gRPC라 readinessProbe는 httpGet 대신
      # tcpSocket을 쓴다(httpGet은 gRPC 포트에 안 맞아 계속 실패 판정 남).
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth-service
          image: 834922934330.dkr.ecr.us-east-1.amazonaws.com/team04-dev-auth-service:dev
          ports:
            - containerPort: 3006
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          readinessProbe:
            tcpSocket:
              port: 3006
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: NODE_ENV
              value: "production"
            # 부하테스트에서 로그인(bcrypt.compare)이 Node 기본 libuv 스레드풀(4개)에
            # 몰려 대기열이 쌓이며 p95가 34초까지 늘어지는 게 확인됨(trouble-shooting:
            # docs/hpa-load-test-report.md Round 3). CPU 바운드 작업이라 스레드 수는
            # pod에 할당된 vCPU 수에 맞춰야 의미가 있다 — prod는 auth-service만 별도로
            # limits.cpu를 2000m(2 vCPU)로 올렸으므로(overlays/prod/
            # auth-service-resources-patch.yaml) 그에 맞춰 8로 설정. 근본 해결책은
            # 아니고 병목 발동 문턱을 늦추는 완화책 — HPA 수평 확장이 더 근본적인 대응.
            - name: UV_THREADPOOL_SIZE
              value: "8"
            - name: USER_SERVICE_HOST
              value: "user-service:3001"
            - name: DB_PORT
              value: "3306"
            - name: REDIS_PORT
              value: "6379"
            - name: JWT_ACCESS_EXPIRES_IN
              value: "15m"
            - name: JWT_REFRESH_EXPIRES_IN
              value: "7d"
            - name: JWT_REFRESH_ABSOLUTE_MAX_DAYS
              value: "30"
            # DB_HOST/REDIS_HOST는 실제 EC2 MariaDB/ElastiCache 엔드포인트(런타임에만 알 수 있음),
            # 나머지는 실제 시크릿 값이라 이 저장소에 하드코딩하지 않고 backend-secrets Secret을
            # 클러스터에 out-of-band로 미리 생성해두었다고 가정하고 참조만 합니다.
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_HOST
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_PASSWORD
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_DATABASE
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: REDIS_HOST
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_TLS
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: REDIS_TLS
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_REFRESH_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
