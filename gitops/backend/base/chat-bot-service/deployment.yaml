apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-bot-service
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-bot-service
  template:
    metadata:
      labels:
        app: chat-bot-service
    spec:
      # backend 네임스페이스의 chatbot-service ServiceAccount를 통해 EKS Pod Identity로
      # DynamoDB/S3Vectors 권한을 받습니다 (infra/terraform/modules/iam/main.tf의
      # aws_iam_role.chatbot_service, chatbot_namespace 변수가 "backend"로 설정되어야 함).
      # ServiceAccount 이름을 바꾸면 권한 연결이 끊깁니다.
      serviceAccountName: chatbot-service
      containers:
        - name: chat-bot-service
          image: 834922934330.dkr.ecr.us-east-1.amazonaws.com/team04-dev-chat-bot-service:dev
          ports:
            - containerPort: 3005
          env:
            - name: NODE_ENV
              value: "production"
            - name: DYNAMODB_REGION
              value: "ap-northeast-2"
            - name: DYNAMODB_CHAT_SESSIONS_TABLE
              value: "ChatSessions"
            - name: DYNAMODB_CHAT_MESSAGES_TABLE
              value: "ChatMessages"
            - name: N8N_TIMEOUT_MS
              value: "30000"
            # DYNAMODB_ENDPOINT / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY는 의도적으로 설정하지
            # 않습니다. backend/.env.example 주석대로 운영에서는 비워두면 EKS Pod Identity로
            # 실제 AWS DynamoDB에 인증됩니다.
            # chatbot-secrets Secret은 이제 backend 네임스페이스에 있어야 합니다 (Secret 참조는
            # 항상 같은 네임스페이스 안에서만 됩니다).
            - name: N8N_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: chatbot-secrets
                  key: N8N_WEBHOOK_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
