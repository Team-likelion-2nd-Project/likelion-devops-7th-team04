apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-bot-service
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-bot-service
  template:
    metadata:
      labels:
        app: chat-bot-service
    spec:
      # backend 네임스페이스의 chatbot-service ServiceAccount를 통해 EKS Pod Identity로
      # DynamoDB/S3Vectors 권한을 받습니다 (infra/terraform/modules/iam/main.tf의
      # aws_iam_role.chatbot_service, chatbot_namespace = "backend"). 이름을 바꾸면 권한
      # 연결이 끊깁니다.
      serviceAccountName: chatbot-service
      containers:
        - name: chat-bot-service
          image: 834922934330.dkr.ecr.us-east-1.amazonaws.com/team04-dev-chat-bot-service:dev
          ports:
            - containerPort: 3005
          env:
            - name: NODE_ENV
              value: "production"
            - name: DYNAMODB_REGION
              value: "ap-northeast-2"
            - name: DYNAMODB_CHAT_SESSIONS_TABLE
              value: "ChatSessions"
            - name: DYNAMODB_CHAT_MESSAGES_TABLE
              value: "ChatMessages"
            - name: N8N_TIMEOUT_MS
              value: "30000"
            # DYNAMODB_ENDPOINT / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY는 의도적으로 설정하지
            # 않습니다. backend/.env.example 주석대로 운영에서는 비워두면 EKS Pod Identity로
            # 실제 AWS DynamoDB에 인증됩니다.
            # n8n(gitops/backend/base/n8n/)도 이 Deployment와 같은 backend 네임스페이스에 있어
            # 짧은 서비스명으로 바로 붙는다. 민감정보가 아닌 고정 내부 URL이라 Secret으로 뺄
            # 필요가 없다(그래서 chatbot-secrets Secret 자체가 존재하지 않는다).
            - name: N8N_WEBHOOK_URL
              value: "http://n8n:5678/webhook/chat"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
