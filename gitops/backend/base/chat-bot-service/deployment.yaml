apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-bot-service
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-bot-service
  template:
    metadata:
      labels:
        app: chat-bot-service
        # DEV-196: api-gateway를 aws_eks_node_group.api_cpu로 이전하며 backend Fargate
        # profile selector가 라벨 게이트로 바뀌어(infra/terraform/modules/eks/main.tf),
        # 지금 배치(Fargate)를 유지하려면 이 라벨이 필요합니다.
        compute: fargate
    spec:
      # backend 네임스페이스의 chatbot-service ServiceAccount를 통해 IRSA(OIDC)로
      # DynamoDB/S3Vectors 권한을 받습니다 (infra/terraform/modules/iam/main.tf의
      # aws_iam_role.chatbot_service — DEV-184에서 Pod Identity는 Fargate에서 동작하지
      # 않아 IRSA로 전환됨, gitops/backend/base/serviceaccount-chatbot.yaml의
      # eks.amazonaws.com/role-arn 어노테이션 참고). 이름을 바꾸면 권한 연결이 끊깁니다.
      serviceAccountName: chatbot-service
      containers:
        - name: chat-bot-service
          image: 834922934330.dkr.ecr.us-east-1.amazonaws.com/team04-dev-chat-bot-service:dev
          ports:
            - containerPort: 3005
          env:
            - name: NODE_ENV
              value: "production"
            # DEV-187/190: ChatSessions/ChatMessages 테이블을 원래 ap-northeast-2로
            # 잘못 쓰고 있었으나, EKS/ECR/VPC 등 이 프로젝트의 다른 인프라가 전부
            # us-east-1이라 그쪽으로 통일 — infra/terraform/modules/dynamodb에서 실제
            # 테이블도 us-east-1에 생성됨.
            - name: DYNAMODB_REGION
              value: "us-east-1"
            - name: DYNAMODB_CHAT_SESSIONS_TABLE
              value: "ChatSessions"
            - name: DYNAMODB_CHAT_MESSAGES_TABLE
              value: "ChatMessages"
            - name: N8N_TIMEOUT_MS
              value: "30000"
            # DYNAMODB_ENDPOINT / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY는 의도적으로 설정하지
            # 않습니다. backend/.env.example 주석대로 운영에서는 비워두면 EKS Pod Identity로
            # 실제 AWS DynamoDB에 인증됩니다.
            # n8n(gitops/langchain/base/n8n/)은 별도 langchain 네임스페이스에 있어 FQDN이
            # 필요하다. 민감정보가 아닌 고정 내부 URL이라 Secret으로 뺄 필요가 없다(그래서
            # chatbot-secrets Secret 자체가 존재하지 않는다).
            - name: N8N_WEBHOOK_URL
              value: "http://n8n.langchain.svc.cluster.local:5678/webhook/chat"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
