apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: langchain
spec:
  replicas: 1
  strategy:
    # emptyDir(아래 참고)라 rolling update로 두 pod가 동시에 뜨면 워크플로가 새 pod에서
    # 다시 import/activate 되어야 하니 Recreate가 더 안전합니다.
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
      # DEV-195: amazon-cloudwatch-observability addon(infra/terraform/modules/eks/main.tf의
      # aws_eks_addon.cloudwatch_observability, 커스텀 configuration_values 없이 기본값)이
      # 클러스터 전체 pod에 4개 언어 자동계측을 기본으로 주입한다 — n8n도 예외 없이 주입받았고
      # (kubectl로 실측: instrumentation.opentelemetry.io/inject-* 어노테이션이 전부 true로
      # 자동으로 붙어 있었음), 이 계측이 n8n의 Node 프로세스에 오버헤드를 더하고 CloudWatch
      # agent(cloudwatch-agent.amazon-cloudwatch:2000)로의 리포팅이 매번 타임아웃 나면서
      # (Export took longer than 30000ms) n8n의 REST 라우트 등록이 activate-workflow.js의
      # 재시도 윈도우(10회/30초)보다 늦어져 매번 postStart hook이 실패 → 컨테이너가
      # SIGTERM으로 죽고 재시작 루프에 빠졌다(PostStartHookError로 실측 확인). 같은 계측을
      # 받는 llm-service는 정상 작동하므로(오버헤드 자체가 만능 원인은 아님) addon의
      # 클러스터 전역 설정은 안 건드리고, n8n pod 하나만 명시적으로 opt-out한다 — 4개 언어
      # 다 끄는 이유는 n8n이 이 중 어떤 런타임도 안 쓰기 때문(끄지 않으면 안 쓰는 언어의
      # init container만 늘어남).
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
    spec:
      # DEV-196: n8n을 langchain Fargate profile selector(compute=fargate 라벨 게이트,
      # infra/terraform/modules/eks/main.tf)에서 빼고 전용 aws_eks_node_group.api_cpu로
      # 이전 — Fargate는 pod마다 새 micro-VM이라 이미지 레이어 캐시가 공유되지 않아 n8n
      # 이미지(~365MB) pull이 매번 6~8분+ 걸리거나 실패(context canceled)하는 문제가
      # registry(ECR 미러/원본 Docker Hub 둘 다)와 무관하게 재현됨 — 영구 EC2 노드면
      # 최초 1회만 이 비용을 치르고 이후 재시작/HPA 스케일아웃 시 캐시를 재사용한다.
      # 위에서 compute=fargate 라벨을 뺐으니 Fargate selector엔 안 걸리고, 아래
      # nodeSelector/toleration으로 새 노드그룹에 명시적으로 배치한다.
      nodeSelector:
        workload: api-cpu
      tolerations:
        - key: dedicated
          value: api-cpu
          effect: NoSchedule
      # 이 Service 이름이 "n8n"이라 Kubernetes가 자동 주입하는 서비스 디스커버리
      # 환경변수(N8N_PORT=tcp://<clusterIP>:5678 등)가 n8n 앱 자신이 기대하는
      # "리스닝 포트 숫자" N8N_PORT와 이름이 충돌한다 — 실제로
      # "Invalid number value for N8N_PORT: tcp://..." 에러/재시작을 겪었다.
      # enableServiceLinks: false로 이 자동 주입 자체를 꺼서 근본적으로 막는다.
      enableServiceLinks: false
      volumes:
        # 로컬 docker-compose는 named volume(n8n_data)에 SQLite DB를 영속화하지만,
        # 여기선 이 네임스페이스(backend)가 Fargate라 EBS PVC를 못 씁니다(Fargate는
        # EFS만 지원, 이번 범위에서 EFS는 새로 안 만듭니다). 대신 pod 하나짜리
        # emptyDir로 두고, 아래 initContainer + postStart hook이 매번(pod 재시작 시마다)
        # "워크플로 import + activate"를 새로 수행해서 GitOps스럽게 재현합니다 —
        # 사용자 데이터/자격증명은 어차피 없고 워크플로 정의 자체가 소스(이 ConfigMap)에서
        # 나오므로 영속성이 없어도 상태를 잃지 않습니다.
        - name: n8n-data
          emptyDir: {}
        - name: n8n-workflow
          configMap:
            name: n8n-workflow
      initContainers:
        # DEV-181: 원래 n8nio/n8n:latest를 Docker Hub에서 직접 pull했으나, Fargate pod는
        # 매번 새 micro-VM이라 캐시가 없고 latest 태그라 pull policy가 Always라서 매번
        # Docker Hub에서 새로 받아와 pod 기동이 느리고 rate limit 대상이 됨 — VPC 내부
        # ECR로 미러링(.github/workflows/backend-ci-cd.yml의 mirror-n8n job)해 pull
        # 속도를 개선했다. 태그는 kustomize(gitops/langchain/overlays/dev/kustomization.yaml)가
        # N8N_VERSION 고정 버전으로 덮어쓴다.
        #
        # 로컬 docker-compose의 n8n-init 서비스 1단계(`n8n import:workflow`)와 동일 —
        # 같은 pod 안의 emptyDir을 공유하므로 메인 컨테이너가 뜨기 전에 워크플로가
        # SQLite DB에 먼저 들어갑니다(항상 비활성 상태로 import됨 — 2단계는 아래
        # postStart hook).
        - name: import-workflow
          image: 834922934330.dkr.ecr.us-east-1.amazonaws.com/team04-dev-n8n:dev
          command: ["sh", "-c"]
          args:
            - "n8n import:workflow --input=/config/chat-orchestration.json"
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
            - name: n8n-workflow
              mountPath: /config
              readOnly: true
      containers:
        - name: n8n
          image: 834922934330.dkr.ecr.us-east-1.amazonaws.com/team04-dev-n8n:dev
          ports:
            - containerPort: 5678
          env:
            - name: WEBHOOK_URL
              value: "http://n8n:5678/"
            - name: N8N_SECURE_COOKIE
              value: "false"
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
            - name: n8n-workflow
              mountPath: /config
              readOnly: true
          lifecycle:
            # 로컬 docker-compose의 n8n-init 서비스 2단계(activate-workflow.js) —
            # 여기선 별도 컨테이너/Job이 아니라 이 컨테이너 자신의 postStart hook으로
            # 실행합니다(localhost로 자기 자신을 호출). 스크립트 자체에 헬스체크
            # 대기 + 재시도 로직이 있어 "메인 프로세스가 아직 요청을 못 받는" 시점에
            # 걸려도 괜찮도록 되어 있습니다(로컬 n8n-init README의 알려진 race와 동일 이유).
            # ⚠️ 이 pod 내부 postStart 방식은 이번 세션에서 실제 클러스터에 대해
            # 검증하지 않았습니다 — postStart가 반복 실패하면 컨테이너가 재시작될 수
            # 있으니 최초 배포 후 `kubectl logs`로 꼭 확인하세요.
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - "N8N_URL=http://localhost:5678 node /config/activate-workflow.js /config/chat-orchestration.json"
          resources:
            # 512Mi 한도로 실제 클러스터에서 기동 중 OOMKilled(exitCode 137)가
            # 발생했음(마이그레이션 + Python task runner 시도 + workflow activate가
            # 기동 시점에 한꺼번에 몰림) — 1Gi로 올림.
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
