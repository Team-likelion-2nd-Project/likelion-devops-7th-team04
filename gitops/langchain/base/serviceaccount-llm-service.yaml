# infra/terraform/modules/eks/main.tf에 llm-service용 aws_eks_pod_identity_association을
# 별도 브랜치에서 추가해야 합니다 — namespace = var.langchain_namespace("langchain"),
# service_account = "llm-service", role_arn = var.chatbot_role_arn(기존 chatbot_service
# role 재사용, s3vectors:PutVectors 권한도 그 role에 추가 필요 — 계획 문서 참고).
# EKS Pod Identity는 IRSA와 달리 ServiceAccount에 eks.amazonaws.com/role-arn 어노테이션이
# 필요 없습니다 (이름만 일치하면 됨). 그 Terraform이 merge/apply되기 전까지는 이 SA를 써도
# S3 Vectors 호출은 권한 에러로 실패하고, retrieval.py가 그 실패를 잡아 None을 반환합니다
# (챗봇 응답 자체는 계속 정상 동작).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-service
  namespace: langchain
