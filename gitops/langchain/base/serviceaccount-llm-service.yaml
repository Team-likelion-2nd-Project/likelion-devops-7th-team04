# DEV-184: 여기 원래 Pod Identity를 쓰라고 적혀 있었으나 이는 잘못된 계획입니다 —
# llm-service도 langchain 네임스페이스에서 compute=fargate 라벨로 CPU Fargate profile에
# 걸려 Fargate로 뜨는데(gitops/langchain/base/llm-service/deployment.yaml 참고),
# Fargate는 DaemonSet인 eks-pod-identity-agent를 못 띄워서 Pod Identity 자격증명 조회가
# 항상 실패합니다 — chatbot_service가 이 문제로 DynamoDB 호출마다 CredentialsProviderError를
# 내며 챗봇이 503을 반환한 것과 동일 원인입니다(DEV-170/DEV-184 참고). 그러니
# infra/terraform/modules/eks/main.tf에 aws_eks_pod_identity_association을 추가하지 말고,
# alb_controller/chatbot_service와 같은 IRSA(OIDC federated) 패턴으로 role을 만들어야
# 합니다(role_arn은 기존 chatbot_service role 재사용 가능, s3vectors:PutVectors 권한만
# 추가). IRSA는 Pod Identity와 달리 아래에 eks.amazonaws.com/role-arn 어노테이션이 있어야
# EKS가 pod에 AWS_ROLE_ARN/AWS_WEB_IDENTITY_TOKEN_FILE을 주입해줍니다. 그 Terraform이
# merge/apply되기 전까지는 이 SA를 써도 S3 Vectors 호출은 자격증명/권한 에러로 실패하고,
# retrieval.py가 그 실패를 잡아 None을 반환합니다(챗봇 응답 자체는 계속 정상 동작).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-service
  namespace: langchain
