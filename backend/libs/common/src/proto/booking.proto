syntax = "proto3";

package booking;

service BookingService {
  rpc GetHello (Empty) returns (HelloResponse);

  // 관리자 전용: 전체 예약 목록 조회 (권한 검증은 api-gateway에서 수행)
  rpc GetBookings (Empty) returns (BookingListResponse);

  // 특정 유저의 예약 목록 조회. /me(본인 조회)와 /:userId(관리자 조회) 양쪽에서 재사용된다.
  rpc GetBookingsByUserId (GetBookingsByUserIdRequest) returns (BookingListResponse);

  // 본인 예약 취소: status를 CANCELLED로 변경하고, hotel-service에 예약 가능일 복구를 요청한다.
  // (reservationId가 없거나 userId가 예약자 본인이 아니면 에러)
  // TODO(환불): payment-service 연동 후 결제 환불 처리를 추가해야 한다 (아직 payment.proto에 없음).
  rpc CancelBooking (CancelBookingRequest) returns (Booking);
  
  // 신규 예약 생성. hotel-service의 ReserveRoomAvailability를 호출해 checkInDate~checkOutDate 전날까지
  // 예약 가능 여부를 검증하고 가격 합계(totalAmount)를 받아온 뒤 예약을 저장한다.
  rpc CreateBooking (CreateBookingRequest) returns (Booking);
}

message Empty {}

message HelloResponse {
  string message = 1;
}

message GetBookingsByUserIdRequest {
  int32 userId = 1;
}

message CancelBookingRequest {
  int32 reservationId = 1;
  int32 userId = 2; // 본인 확인용 (api-gateway가 JWT에서 추출해 넘긴다)
}

message CreateBookingRequest {
  int32 userId = 1;
  int32 roomId = 2;
  string checkInDate = 3;
  string checkOutDate = 4;
  bool hasIndoorPool = 5;
  bool hasLounge = 6;
  int32 guestCount = 7;
}

message Booking {
  int32 reservationId = 1;
  int32 userId = 2;
  int32 roomId = 3;
  string checkInDate = 4;
  string checkOutDate = 5;
  bool hasIndoorPool = 6;
  bool hasLounge = 7;
  int32 totalAmount = 8;
  string status = 9;
  int32 guestCount = 10;
}

message BookingListResponse {
  repeated Booking bookings = 1;
}
