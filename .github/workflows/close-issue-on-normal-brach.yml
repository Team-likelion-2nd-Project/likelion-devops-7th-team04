name: Close Linked Issue on Non-Default Branch Merge

# 이 저장소의 기본 브랜치는 develop이며, develop으로 머지되는 PR은
# GitHub 기본 기능(Closes #N)이 자동으로 이슈를 닫아준다.
# 아래 branches 목록(infra, main)은 그와 별개로 "비-기본 브랜치"로 취급해
# 자동 닫기 대상으로 삼는 브랜치들이다. 브랜치 전략이 바뀌면 이 목록도 함께 갱신할 것.
on:
  pull_request:
    types: [closed]
    branches:
      - infra
      - main

jobs:
  close-issue:
    # PR이 실제로 머지(merged == true)된 경우에만 실행
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: read

    steps:
      - name: Close Linked Issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const rawBody = context.payload.pull_request.body || "";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseBranch = context.payload.pull_request.base.ref;

            // 코드 블록(``` ... ``` / `...`) 안에 예시로 적힌 "Closes #40" 같은
            // 문구가 실제 이슈 참조로 오인되지 않도록 매칭 전에 제거한다.
            const body = rawBody
              .replace(/```[\s\S]*?```/g, "")
              .replace(/`[^`]*`/g, "");

            // Closes #40, Fixes #40, Resolves #40 등 키워드 패턴 정규식
            const re = /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/gi;
            let match;

            // 같은 이슈가 본문에 여러 번 언급돼도 한 번만 처리하도록 중복 제거
            const issueNumbers = new Set();
            while ((match = re.exec(body)) !== null) {
              issueNumbers.add(parseInt(match[1], 10));
            }

            for (const issueNumber of issueNumbers) {
              console.log(`Found linked issue to close: #${issueNumber}`);

              try {
                // 해당 이슈 상태를 'closed'로 변경
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  state: 'closed'
                });

                // 코멘트 남기기 (선택 사항)
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: `🎉 이 이슈는 PR #${context.payload.pull_request.number}가 \`${baseBranch}\` 브랜치에 머지됨에 따라 자동으로 닫혔습니다.`
                });
              } catch (err) {
                console.error(`Failed to close issue #${issueNumber}: ${err.message}`);
              }
            }