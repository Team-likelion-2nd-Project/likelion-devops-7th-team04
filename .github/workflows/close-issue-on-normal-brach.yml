name: Close Linked Issue & Sync Jira on Non-Default Branch Merge

on:
  pull_request:
    types: [closed]
    branches:
      - infra
      - main

jobs:
  close-issue-and-sync-jira:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: read

    steps:
      # Step 1. PR 본문에서 이슈 번호 추출 (Set 중복 제거)
      - name: Extract Linked Issue Numbers
        id: extract_issues
        uses: actions/github-script@v7
        with:
          script: |
            const rawBody = context.payload.pull_request.body || "";
            const body = rawBody
              .replace(/```[\s\S]*?```/g, "")
              .replace(/`[^`]*`/g, "");

            const re = /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/gi;
            const issueNumbers = new Set();
            let match;

            while ((match = re.exec(body)) !== null) {
              issueNumbers.add(match[1]);
            }

            const issuesArray = Array.from(issueNumbers);
            console.log(`Found issues: ${issuesArray.join(", ")}`);
            
            core.setOutput("issue_numbers", issuesArray.join(","));
            core.setOutput("has_issues", issuesArray.length > 0 ? "true" : "false");

      # Step 2. GitHub 이슈 상태 'closed' 변경 & PR 코멘트 작성 + 지라 키 추출
      - name: Close Issues & Extract Jira Key
        if: steps.extract_issues.outputs.has_issues == 'true'
        id: process_issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseBranch = context.payload.pull_request.base.ref;
            const prNumber = context.payload.pull_request.number;
            const issueNumbers = "${{ steps.extract_issues.outputs.issue_numbers }}".split(",");

            let jiraKey = "";

            for (const issueStr of issueNumbers) {
              const issueNumber = parseInt(issueStr.trim(), 10);
              if (isNaN(issueNumber)) continue;

              try {
                // 1. 이슈 제목 조회를 통해 지라 키 찾아내기
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                const jiraMatch = issue.title.match(/([A-Z]{2,}-\d+)/);
                if (jiraMatch && !jiraKey) {
                  jiraKey = jiraMatch[1];
                }

                // 2. 이슈 상태 'closed' 변경
                await github.rest.issues.update({
                  owner, repo, issue_number: issueNumber, state: 'closed'
                });

                // 3. PR 코멘트 작성
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: `🎉 이 이슈는 PR #${prNumber}가 \`${baseBranch}\` 브랜치에 머지됨에 따라 자동으로 닫혔습니다.`
                });
              } catch (err) {
                console.error(`Failed to process issue #${issueNumber}: ${err.message}`);
              }
            }

            if (jiraKey) {
              console.log(`Found Jira Key: ${jiraKey}`);
              core.setOutput("jira_key", jiraKey);
              core.setOutput("has_key", "true");
            } else {
              console.log("No Jira Key found in linked issues.");
              core.setOutput("has_key", "false");
            }

      # Step 3. 지라 키가 존재하는 경우에만 로그인
      - name: Login to Jira
        if: steps.process_issues.outputs.has_key == 'true'
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      # Step 4. 지라 이슈 상태를 '완료'로 변경
      - name: Transition Jira Issue to 'Done'
        if: steps.process_issues.outputs.has_key == 'true'
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.process_issues.outputs.jira_key }}
          transition: "완료" # 지라 보드의 컬럼명이 영문이면 "Done"으로 수정