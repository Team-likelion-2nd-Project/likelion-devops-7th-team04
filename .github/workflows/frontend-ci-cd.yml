name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'frontend/**'  # 프론트엔드 코드 변경 시에만 작동
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'frontend/**'

permissions:
  id-token: write  # AWS OIDC 인증에 필수 권한
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Node.js 환경 세팅
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # 3. 의존성 패키지 설치 및 Vite 빌드
      - name: Install Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      # 4. AWS OIDC 로그인 (Access Key 없이 안전하게 인증)
      - name: Configure AWS Credentials via OIDC
        if: github.event_name == 'push'  # Push 이벤트 시에만 실제 S3/CloudFront 배포 수행
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: us-east-1

      # 5. S3 정적 파일 업로드 (Vite 결과물인 dist 폴더 지정)
      - name: Deploy to S3
        if: github.event_name == 'push'
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.FRONTEND_S3_BUCKET_NAME }} --delete

      # 6. CloudFront 캐시 무효화
      - name: Invalidate CloudFront Cache
        if: github.event_name == 'push'
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"