name: Frontend CI/CD Pipeline

on:
  # 1. 자동 CI 트리거: develop, infra, main 브랜치 대상 PR 및 Push 발생 시 실행
  push:
    branches:
      - develop
      - infra
      - main
    paths:
      - 'frontend/**'
  pull_request:
    branches:
      - develop
      - infra
      - main
    paths:
      - 'frontend/**'

  # 2. 수동 CD 트리거
  workflow_dispatch:

permissions:
  id-token: write  # AWS OIDC 인증 권한
  contents: read

jobs:
  # [자동 CI] 코드 변경 시 빌드 및 테스트 자동 검증
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies & Vite Build
        run: |
          cd frontend
          npm ci
          npm run build

  # [수동 CD] Actions 탭에서 Run workflow 클릭 시 실행
  deploy:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'  # 수동 트리거일 때만 작동
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies & Vite Build
        run: |
          cd frontend
          npm ci
          npm run build

      # 1. AWS OIDC 인증 (GitHub Actions -> AWS CICD Role)
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CICD_ROLE_ARN }}
          aws-region: us-east-1

      # 2. OIDC 인증 자격 증명으로 S3 배포 수행
      - name: Deploy to S3 (Vite dist folder)
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.FRONTEND_S3_BUCKET_NAME }} --delete

      # 3. OIDC 인증 자격 증명으로 CloudFront 캐시 무효화
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"