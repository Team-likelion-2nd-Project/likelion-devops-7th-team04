name: Frontend CI/CD Pipeline

on:
  # 1. 자동 CI 트리거: develop, infra, main 브랜치 대상 PR 및 Push 발생 시 실행
  push:
    branches:
      - develop
      - infra
      - main
    paths:
      - 'frontend/**'
  pull_request:
    branches:
      - develop
      - infra
      - main
    paths:
      - 'frontend/**'

  # 2. 수동 CD 트리거
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # [자동 CI] 코드 변경 시 빌드 및 테스트 자동 검증
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies & Vite Build
        run: |
          cd frontend
          npm ci
          npm run build

  # [수동 CD] Actions 탭에서 Run workflow 클릭 시 실행
  # 계정 SCP가 OIDC(sts:AssumeRoleWithWebIdentity)를 막고 있어, GitHub-hosted runner +
  # OIDC 조합을 쓸 수 없다 (backend-ci-cd.yml과 동일한 제약). 대신 self-hosted EC2 runner의
  # Instance Profile로 S3/CloudFront 권한을 바로 받는다.
  deploy:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'  # 수동 트리거일 때만 작동
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies & Vite Build
        run: |
          cd frontend
          npm ci
          npm run build

      # EC2 Instance Profile 자격증명을 자동으로 사용합니다 (별도 인증 스텝 불필요).
      - name: Deploy to S3 (Vite dist folder)
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.FRONTEND_S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"