name: Backend CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: team04
  ENVIRONMENT: dev

jobs:
  backend-cd:
    name: Build and Push Backend Images
    runs-on: ubuntu-latest

    # 수동 실행이라도 develop 브랜치에서만 배포 허용
    if: github.ref == 'refs/heads/develop'

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - booking-service
          - chat-bot-service
          - hotel-service
          - payment-service
          - user-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image variables
        shell: bash
        run: |
          echo "REPOSITORY=${PROJECT_NAME}-${ENVIRONMENT}-${{ matrix.service }}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -f backend/apps/${{ matrix.service }}/Dockerfile \
            -t ${{ steps.login-ecr.outputs.registry }}/${REPOSITORY}:${IMAGE_TAG} \
            backend

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${REPOSITORY}:${IMAGE_TAG}

      - name: Print pushed image
        run: |
          echo "${{ matrix.service }}"
          echo "${{ steps.login-ecr.outputs.registry }}/${REPOSITORY}:${IMAGE_TAG}"