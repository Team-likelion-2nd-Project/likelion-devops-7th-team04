name: Sync Jira Status & PR Info

on:
  pull_request:
    types: [opened, reopened, review_requested]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: jira-pr-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false # 💡 앞 작업이 지라 상태를 다 바꿀 때까지 순서대로 대기시킴

jobs:
  sync-jira:
    runs-on: ubuntu-latest

    steps:
      # 1. 🚀 PR 'opened' 또는 'reopened' 일 때만 실행: PR 제목/본문 자동 업데이트 및 지라 키 추출
      - name: Enhance PR Title & Body (Opened Only)
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        id: process_pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const headBranch = pr.head.ref;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 브랜치명에서 Jira Key 추출
            const jiraMatch = headBranch.match(/([A-Z0-9]+-\d+)/i);
            if (!jiraMatch) {
              console.log("::warning::브랜치명에서 Jira Key를 찾을 수 없습니다.");
              core.setOutput("has_key", "false");
              return;
            }

            const jiraKey = jiraMatch[1].toUpperCase();
            console.log(`Found Jira Key from Branch: ${jiraKey}`);
            core.setOutput("jira_key", jiraKey);
            core.setOutput("has_key", "true");

            // PR 제목 업데이트 ([DEV-145] 접두사)
            let updatedTitle = pr.title;
            if (!updatedTitle.startsWith(`[${jiraKey}]`)) {
              updatedTitle = `[${jiraKey}] ${pr.title.replace(/^\[[A-Z0-9]+-\d+\]\s*/i, '')}`;
            }

            // GitHub Issue 번호 연동
            let linkedIssueNumber = null;
            try {
              const issues = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
              const targetIssue = issues.data.find(issue => !issue.pull_request && issue.title.includes(jiraKey));
              if (targetIssue) linkedIssueNumber = targetIssue.number;
            } catch (err) {
              console.warn(`Error finding issue: ${err.message}`);
            }

            // PR 본문 업데이트
            let updatedBody = pr.body || "";
            let isBodyChanged = false;
            if (linkedIssueNumber && !updatedBody.includes(`Closes #${linkedIssueNumber}`)) {
              updatedBody += `\n\n---\nCloses #${linkedIssueNumber}`;
              isBodyChanged = true;
            }

            if (updatedTitle !== pr.title || isBodyChanged) {
              await github.rest.pulls.update({
                owner, repo, pull_number: pr.number, title: updatedTitle, body: updatedBody
              });
            }

      # 2. 🚀 'review_requested' 일 때만 실행: PR 제목/브랜치명에서 지라 키 추출
      - name: Extract Jira Key (Review Requested Only)
        if: github.event.action == 'review_requested'
        id: extract_key_rerequest
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"

          JIRA_KEY=$(echo "$PR_TITLE" | grep -oE '[A-Z]{2,}-[0-9]+' | head -n 1)
          if [ -z "$JIRA_KEY" ]; then
            JIRA_KEY=$(echo "$PR_BRANCH" | grep -oE '[A-Z]{2,}-[0-9]+' | head -n 1)
          fi

          if [ -n "$JIRA_KEY" ]; then
            echo "jira_key=$JIRA_KEY" >> $GITHUB_OUTPUT
            echo "has_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_key=false" >> $GITHUB_OUTPUT
          fi

      # 3. 💡 공통 지라 키 변수 통합 (Opened 또는 Review Requested 결과 중 존재하는 키 사용)
      - name: Set Unified Jira Key
        id: unified_key
        run: |
          KEY_OPENED="${{ steps.process_pr.outputs.jira_key }}"
          KEY_REREQUEST="${{ steps.extract_key_rerequest.outputs.jira_key }}"
          
          FINAL_KEY="${KEY_OPENED:-$KEY_REREQUEST}"

          if [ -n "$FINAL_KEY" ]; then
            echo "jira_key=$FINAL_KEY" >> $GITHUB_OUTPUT
            echo "has_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_key=false" >> $GITHUB_OUTPUT
          fi

      # 4. 🔄 공통: 지라 현재 상태 조회 (이미 '검토 요청'이면 스킵)
      - name: Check Jira Status
        if: steps.unified_key.outputs.has_key == 'true'
        id: check_status
        run: |
          JIRA_KEY="${{ steps.unified_key.outputs.jira_key }}"
          
          RESPONSE=$(curl -s -u "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Accept: application/json" \
            "${{ secrets.JIRA_BASE_URL }}/rest/api/2/issue/$JIRA_KEY?fields=status")

          CURRENT_STATUS=$(echo "$RESPONSE" | jq -r '.fields.status.name')
          echo "Current Status: $CURRENT_STATUS"

          if [ "$CURRENT_STATUS" != "검토 요청" ]; then
            echo "need_transition=true" >> $GITHUB_OUTPUT
          else
            echo "이미 '검토 요청' 상태이므로 트랜지션을 진행하지 않습니다."
            echo "need_transition=false" >> $GITHUB_OUTPUT
          fi

      # 5. 🔄 공통: 지라 로그인
      - name: Login to Jira
        if: steps.unified_key.outputs.has_key == 'true' && steps.check_status.outputs.need_transition == 'true'
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      # 6. 🔄 공통: 지라 이슈 상태를 '검토 요청'으로 이동
      - name: Transition Jira Issue to 'In Review'
        if: steps.unified_key.outputs.has_key == 'true' && steps.check_status.outputs.need_transition == 'true'
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.unified_key.outputs.jira_key }}
          transition: "검토 요청"