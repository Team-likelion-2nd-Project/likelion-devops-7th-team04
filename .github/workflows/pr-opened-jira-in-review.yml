name: 1. PR Opened -> Sync Title, Body & Move Jira to In Review

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  move-jira-to-in-review:
    runs-on: ubuntu-latest
    steps:
      # 1. 브랜치명에서 Jira Key 추출 및 PR 제목/본문 자동 업데이트
      - name: Enhance PR Title & Body with Jira & Issue Info
        id: process_pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const headBranch = pr.head.ref; // 예: DEV-145-login-api 또는 [DEV-145]-login-api
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            console.log(`Head Branch Name: ${headBranch}`);

            // 1) 브랜치명에서 Jira Key 추출 (DEV-145)
            const jiraMatch = headBranch.match(/([A-Z0-9]+-\d+)/i);
            if (!jiraMatch) {
              console.log("::warning::브랜치명에서 Jira Issue Key를 찾을 수 없습니다.");
              core.setOutput("has_key", "false");
              return;
            }

            const jiraKey = jiraMatch[1].toUpperCase();
            console.log(`Extracted Jira Key: ${jiraKey}`);
            core.setOutput("jira_key", jiraKey);
            core.setOutput("has_key", "true");

            // 2) PR 제목 업데이트 ([DEV-145] 접두사 부착)
            let updatedTitle = pr.title;
            if (!updatedTitle.startsWith(`[${jiraKey}]`)) {
              updatedTitle = `[${jiraKey}] ${pr.title.replace(/^\[[A-Z0-9]+-\d+\]\s*/i, '')}`;
              console.log(`Updating PR Title to: ${updatedTitle}`);
            }

            // 3) Jira Key로 연결된 GitHub Issue 번호 검색
            let linkedIssueNumber = null;
            try {
              const issues = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                per_page: 100
              });

              // 제목에 [DEV-145] 등이 포함된 GitHub Issue 찾기
              const targetIssue = issues.data.find(issue => 
                !issue.pull_request && issue.title.includes(jiraKey)
              );

              if (targetIssue) {
                linkedIssueNumber = targetIssue.number;
                console.log(`Found matching GitHub Issue #${linkedIssueNumber}`);
              } else {
                console.log(`No open GitHub Issue found matching ${jiraKey}`);
              }
            } catch (err) {
              console.warn(`Error searching for GitHub Issue: ${err.message}`);
            }

            // 4) PR 본문(Body) 업데이트 (Closes #이슈번호 및 Jira 링크 추가)
            let updatedBody = pr.body || "";
            let isBodyChanged = false;

            // GitHub Issue 연동 키워드 추가
            if (linkedIssueNumber && !updatedBody.includes(`Closes #${linkedIssueNumber}`)) {
              updatedBody += `\n\n---\nCloses #${linkedIssueNumber}`;
              isBodyChanged = true;
            }

            // PR 제목이나 본문에 변경이 있는 경우에만 GitHub PR Update API 호출
            if (updatedTitle !== pr.title || isBodyChanged) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title: updatedTitle,
                body: updatedBody
              });
              console.log("✅ Successfully updated PR Title and Body!");
            }

      # 2. Jira 로그인
      - name: Login to Jira
        if: steps.process_pr.outputs.has_key == 'true'
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      # 3. Jira 이슈 상태 변경 ('검토 요청'으로 이동)
      - name: Transition Jira Issue to 'In Review'
        if: steps.process_pr.outputs.has_key == 'true'
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.process_pr.outputs.jira_key }}
          transition: "검토 요청" # 지라 설정에 맞춰 "In Review" 등으로 수정 가능
