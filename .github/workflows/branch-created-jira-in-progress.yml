name: Sync Jira Status on Branch Created

on:
  create:

jobs:
  sync-jira-branch:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      # 1. 브랜치명에서 지라 키 추출
      - name: Extract Jira Key
        id: extract_key
        run: |
          BRANCH_NAME="${{ github.event.ref }}"
          echo "Created Branch: $BRANCH_NAME"

          JIRA_KEY=$(echo "$BRANCH_NAME" | grep -oE '[A-Z0-9]+-[0-9]+' | head -n 1)

          if [ -n "$JIRA_KEY" ]; then
            echo "Found Jira Key: $JIRA_KEY"
            echo "jira_key=$JIRA_KEY" >> $GITHUB_OUTPUT
            echo "has_key=true" >> $GITHUB_OUTPUT
          else
            echo "지라 키가 없는 브랜치입니다. (Skip)"
            echo "has_key=false" >> $GITHUB_OUTPUT
          fi

      # 2. 지라 로그인
      - name: Login to Jira
        if: steps.extract_key.outputs.has_key == 'true'
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      # 3. 백로그 영역에 있는 태스크를 Board(보드) 영역으로 강제 이동
      - name: Move Backlog Issue to Board
        if: steps.extract_key.outputs.has_key == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const jiraKey = "${{ steps.extract_key.outputs.jira_key }}";
            const domain = process.env.JIRA_BASE_URL.replace(/\/$/, "");
            const authHeader = 'Basic ' + Buffer.from(`${process.env.JIRA_USER_EMAIL}:${process.env.JIRA_API_TOKEN}`).toString('base64');
            const headers = { 'Authorization': authHeader, 'Content-Type': 'application/json' };

            try {
              // 1) 프로젝트의 보드 ID 자동 조회
              const projectKey = jiraKey.split('-')[0];
              const boardRes = await fetch(`${domain}/rest/agile/1.0/board?projectKeyOrId=${projectKey}`, { headers });
              const boardData = await boardRes.json();

              if (boardData.values && boardData.values.length > 0) {
                const boardId = boardData.values[0].id;
                console.log(`Found Board ID: ${boardId} for project ${projectKey}`);

                // 2) 해당 보드(Board)로 이슈 이동 API 호출
                const moveRes = await fetch(`${domain}/rest/agile/1.0/board/${boardId}/issue`, {
                  method: 'POST',
                  headers,
                  body: JSON.stringify({ issues: [jiraKey] })
                });

                console.log(`Board Move Response Status: ${moveRes.status}`);
              } else {
                console.log(`No board found for project ${projectKey}`);
              }
            } catch (err) {
              console.log(`Error moving issue to board: ${err.message}`);
            }
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      # 4. 지라 이슈 상태를 '진행 중'으로 변경
      - name: Transition Jira Issue to 'In Progress'
        if: steps.extract_key.outputs.has_key == 'true'
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.extract_key.outputs.jira_key }}
          transition: "진행 중" # 지라 컬럼명이 영문이면 "In Progress"로 수정