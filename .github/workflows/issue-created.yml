name: GitHub Issue → Jira Sync

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

env:
  PROJECT_KEY: DEV
  ALLOWED_WORK_TYPES: feature,bug,docs,infra
  ALLOWED_PRIORITIES: Highest,High,Medium,Low,Lowest
  JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
  JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

jobs:
  validate:
    name: Validate GitHub Issue
    runs-on: ubuntu-latest

    outputs:
      jira_enabled: ${{ steps.validate.outputs.jira_enabled }}
      jira_target: ${{ steps.validate.outputs.jira_target }}

    steps:
      - name: Validate Issue
        id: validate
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue=context.payload.issue;
            const owner=context.repo.owner;
            const repo=context.repo.repo;
            const issueNumber=issue.number;
            const issueTitle=issue.title;
            const issueBody=issue.body ?? "";
            const milestone=issue.milestone?.title ?? null;
            const milestoneDescription = issue.milestone?.description ?? "";
            const labels=issue.labels.map(
              l=>l.name.trim().toLowerCase()
            );

            if(labels.length!==1){
              throw new Error(
                "Exactly one Work Type label is required."
              );
            } 

            const workType=labels[0];

            const errors=[];

            const CONFIG={
              workTypes:process.env.ALLOWED_WORK_TYPES
                .split(",")
                .map(type=>type.trim().toLowerCase()),

              priorities:process.env.ALLOWED_PRIORITIES.split(","),

              projectKey:process.env.PROJECT_KEY
            };

            const jiraTarget =
              CONFIG.workTypes.includes(workType);

            core.setOutput(
              "jira_target",
              jiraTarget ? "true" : "false"
            );

            if(!jiraTarget){
              console.log(
                "Skip Jira Sync. Unsupported Work Type."
              );
              return;
            }

            

            const getField=(name)=>{
              const regex=new RegExp(
                "###\\s*" +
                name +
                "\\s*\\n([\\s\\S]*?)(?=\\n###|$)",
                "i"
              );

              return issueBody.match(regex)?.[1]?.trim() ?? "";
            };

            const jiraEnabled=getField("Jira Task 생성").toUpperCase();
            const priority=getField("Jira Priority");

            const getEpicKey = () => {

              const match =
                milestoneDescription.match(
                  /JIRA_EPIC_KEY\s*=\s*([A-Z]+-\d+)/
                );

              return match?.[1] ?? null;

            };

            if(jiraEnabled!=="ON"){
              console.log("Jira Sync Disabled.");
              core.setOutput("jira_enabled","false");
              return;
            }

            core.setOutput("jira_enabled","true");

            const validateDuplicate=()=>{
              if(/^\[[A-Z]+-\d+\]/.test(issueTitle)){
                errors.push(
                  "This issue is already linked to Jira."
                );
              }
            };

            const validateLabel=()=>{
              if(labels.length!==1){
                errors.push(
                  "Exactly one Work Type label must be selected."
                );
                return;
              }
            };

            const validatePriority=()=>{
              if(!CONFIG.priorities.includes(priority)){
                errors.push(
                  "Unsupported Jira Priority: " + priority
                );
              }
            };

            const validateMilestone=()=>{
              if(!milestone){
                errors.push(
                  "Milestone is required."
                );
              }

              if(!getEpicKey()){
                errors.push(
                  "Milestone must contain JIRA_EPIC_KEY."
                );
              }
            };

            validateDuplicate();
            validateLabel();
            validatePriority();
            validateMilestone();

            if(errors.length===0){
              console.log("Validation Passed.");
              return;
            }

            const body=[
              "## ❌ GitHub Issue Validation Failed",
              "",
              "다음 항목을 수정한 후 다시 실행하세요.",
              "",
              ...errors.map(e=>"- " + e)
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number:issueNumber,
              body
            });

            core.setFailed(
              errors.join("\n")
            );
  jira-sync:
    name: Create Jira Task
    needs: validate
    if: needs.validate.outputs.jira_enabled == 'true' && needs.validate.outputs.jira_target == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Create Jira Task
        uses: actions/github-script@v7
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          PROJECT_KEY: ${{ env.PROJECT_KEY }}
          JIRA_EPIC_TYPE_ID: ${{ env.JIRA_EPIC_TYPE_ID }}

        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const issueNumber = issue.number;
            const issueTitle = issue.title;
            const issueBody = issue.body ?? "";

            const milestone = issue.milestone?.title;
            const milestoneDescription = issue.milestone?.description ?? "";
            const labels = issue.labels.map(label => label.name);


            const getField = (name) => {
              const regex = new RegExp(
                "###\\s*" +
                name +
                "\\s*\\n([\\s\\S]*?)(?=\\n###|$)",
                "i"
              );

              return issueBody.match(regex)?.[1]?.trim() ?? "";
            };


            const priority = getField("Jira Priority");


            if (!milestone) {
              throw new Error(
                "Milestone is required for Jira Epic mapping."
              );
            }


            if (labels.length !== 1) {
              throw new Error(
                "Exactly one Work Type label is required."
              );
            }


            const workType = labels[0];


            const auth = Buffer
              .from(
                process.env.JIRA_USER_EMAIL +
                ":" +
                process.env.JIRA_API_TOKEN
              )
              .toString("base64");


            const jiraRequest = async(path, options = {}) => {

              const response = await fetch(
                process.env.JIRA_BASE_URL + path,
                {
                  ...options,
                  headers:{
                    Authorization:"Basic " + auth,
                    Accept:"application/json",
                    "Content-Type":"application/json"
                  }
                }
              );


              if(!response.ok){

                const error =
                  await response.text();

                throw new Error(error);
              }


              return response.json();
            };



            /*
             * Milestone 제목과 동일한 Epic 검색
             */

            const jql =
              "project=" +
              process.env.PROJECT_KEY +
              " AND issuetype=Epic" +
              ' AND summary ~ "' +
              milestone +
              '"';

            const epicMatch =
              milestoneDescription.match(
                /JIRA_EPIC_KEY\s*=\s*([A-Z]+-\d+)/
              );


            const epicKey =
              epicMatch?.[1];


            if(!epicKey){
              throw new Error(
                "JIRA_EPIC_KEY is missing from milestone."
              );
            }

            /*
             * Jira Task 생성
             */

            const createdIssue =
              await jiraRequest(
                "/rest/api/3/issue",
                {
                  method:"POST",
                  body:JSON.stringify({

                    fields:{

                      project:{
                        key:process.env.PROJECT_KEY
                      },


                      parent:{
                        key:epicKey
                      },


                      issuetype:{
                        name:workType
                      },


                      priority:{
                        name:priority
                      },


                      summary:issueTitle,


                      description:{
                        type:"doc",
                        version:1,
                        content:[
                          {
                            type:"paragraph",
                            content:[
                              {
                                type:"text",
                                text:
                                  issueBody ||
                                  "Created from GitHub Issue"
                              }
                            ]
                          }
                        ]
                      }

                    }

                  })
                }
              );


            const jiraKey =
              createdIssue.key;


            const jiraUrl =
              process.env.JIRA_BASE_URL +
              "/browse/" +
              jiraKey;



            /*
             * GitHub Issue 업데이트
             */

            await github.rest.issues.update({

              owner,
              repo,

              issue_number:issueNumber,

              title:
                "[" +
                jiraKey +
                "] " +
                issueTitle,

              body: [
                issueBody,
                "",
                "---",
                "",
                "## Jira Task",
                "",
                jiraKey,
                "",
                jiraUrl
              ].join("\n")
            });



            await github.rest.issues.createComment({

              owner,
              repo,

              issue_number:issueNumber,

              body: [
                "✅ Jira Task Created",
                "",
                jiraKey,
                "",
                jiraUrl
              ].join("\n")
            });