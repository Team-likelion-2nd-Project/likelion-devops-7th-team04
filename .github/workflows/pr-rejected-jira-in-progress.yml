name: Sync Jira Status on PR Request Changes

on:
  pull_request_review:
    # 리뷰어가 리뷰 제출(Submitted)을 눌렀을 때 트리거
    types: [submitted]

jobs:
  sync-to-in-progress:
    # 제출된 리뷰의 상태가 'changes_requested' (수정 요청/반려)일 때만 실행
    if: github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest

    steps:
      # 1. PR 제목 또는 브랜치명에서 [DEV-16] 형태의 지라 키 추출
      - name: Extract Jira Key
        id: extract_key
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"
          
          echo "PR Title: $PR_TITLE"
          echo "PR Branch: $PR_BRANCH"

          # PR 제목 우선 검색, 없으면 브랜치명에서 대문자 2자 이상 지라 키 추출 (2026-08 같은 날짜 오인 방지)
          JIRA_KEY=$(echo "$PR_TITLE" | grep -oE '[A-Z]{2,}-[0-9]+' | head -n 1)
          if [ -z "$JIRA_KEY" ]; then
            JIRA_KEY=$(echo "$PR_BRANCH" | grep -oE '[A-Z]{2,}-[0-9]+' | head -n 1)
          fi

          if [ -z "$JIRA_KEY" ]; then
            echo "::warning::지라 키를 찾을 수 없습니다. (Skip)"
            echo "has_key=false" >> $GITHUB_OUTPUT
          else
            echo "Found Jira Key: $JIRA_KEY"
            echo "jira_key=$JIRA_KEY" >> $GITHUB_OUTPUT
            echo "has_key=true" >> $GITHUB_OUTPUT
          fi

      # 2. 지라 로그인
      - name: Login to Jira
        if: steps.extract_key.outputs.has_key == 'true'
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      # 3. 지라 이슈 상태를 '진행중(In Progress)'으로 자동 변경
      - name: Transition Jira Issue to 'In Progress'
        if: steps.extract_key.outputs.has_key == 'true'
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.extract_key.outputs.jira_key }}
          transition: "In Progress" # 💡 팀의 지라 보드 컬럼명이 한글이면 "진행중"으로 수정