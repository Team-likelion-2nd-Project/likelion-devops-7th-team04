name: Feature Request

description: 새로운 기능 개발 요청

labels:
  - Feature

body:

  - type: markdown
    attributes:
      value: |
        ## Feature Request

        새로운 기능 개발 요청입니다.
        Jira Task 생성 여부와 Priority를 선택해주세요.


  - type: dropdown
    id: jira-create
    attributes:
      label: Jira Task 생성
      description: Jira Task 자동 생성을 활성화할지 선택합니다.
      options:
        - "ON"
        - "OFF"
    validations:
      required: true


  - type: dropdown
    id: priority
    attributes:
      label: Jira Priority
      description: Jira Task Priority를 선택합니다.
      options:
        - Highest
        - High
        - Medium
        - Low
        - Lowest
    validations:
      required: true


  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 구현하려는 기능과 필요한 내용을 작성해주세요.
      placeholder: |
        예:
        - 기능 설명
        - 필요한 API
        - 예상 작업 범위
    validations:
      required: true